name: Retry InkArcana v1.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feature-v1.5.0-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair and apply v1.5 feature layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_v1_5.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("test.write_text(r'''import re", 'test.write_text(r"""import re', 1)
          tail = 'print("=== Verification completed ===")\n\'\'\', encoding="utf-8")'
          replacement = 'print("=== Verification completed ===")\n""", encoding="utf-8")'
          if tail not in s:
              raise SystemExit('test-suite closing marker not found')
          p.write_text(s.replace(tail, replacement, 1), encoding='utf-8')
          PY
          python tools/apply_v1_5.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python test_suite.py

      - name: Rebuild and verify package
        run: python verify_container.py

      - name: Commit v1.5.0 source and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua manifest.json verify_container.py test_suite.py README.md inkarcana.xtapp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add InkArcana v1.5.0 features [skip ci]"
            git push
          fi

      - name: Publish v1.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## InkArcana v1.5.0

          InkArcana now includes richer deck study and lightweight reading continuity while staying within the X4 Pro constraints.

          - Study mode adds deck filters, card metadata and progress markers. Favourites can be browsed as their own filtered view.
          - Spreads gain an overview and recent-reading history. Saved spreads can be reopened, and the overview can create another spread of the same type.
          - Longer meanings use pagination instead of being silently cut off. A Help screen explains the main modes and controls.
          - The daily screen shows the date more explicitly. Study keeps upright and reversed meanings independently available.

          Regression tests and Licorice package verification pass on this build. Physical-device testing remains recommended for final UI judgement.
          EOF
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 inkarcana.xtapp --clobber
            gh release edit v1.5.0 --title "InkArcana v1.5.0" --notes-file release-notes.md
          else
            gh release create v1.5.0 inkarcana.xtapp \
              --target "$(git rev-parse HEAD)" \
              --title "InkArcana v1.5.0" \
              --notes-file release-notes.md
          fi
