name: Build and publish InkArcana v1.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/feature-v1.5.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v1.5 feature layer
        run: python tools/apply_v1_5.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python test_suite.py

      - name: Rebuild and verify package
        run: python verify_container.py

      - name: Commit v1.5.0 source and package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua manifest.json verify_container.py test_suite.py README.md inkarcana.xtapp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add InkArcana v1.5.0 features [skip ci]"
            git push
          fi

      - name: Publish v1.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## InkArcana v1.5.0

          This release expands InkArcana while keeping the e-paper interface lightweight.

          - Study mode adds suit and progress filters, card metadata, learned-card tracking and favourites. Random study respects the active filter.
          - Spreads gain an overview, lightweight recent-reading history and a direct way to generate another spread of the same type.
          - Long meanings are paginated instead of being silently cut off. A Help screen explains the main controls and modes.
          - The daily screen now shows the current date more explicitly, while Study keeps upright and reversed meanings independently available.

          Regression tests and Licorice package verification pass on this build. Physical-device testing remains recommended for final UI judgement.
          EOF
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 inkarcana.xtapp --clobber
            gh release edit v1.5.0 --title "InkArcana v1.5.0" --notes-file release-notes.md
          else
            gh release create v1.5.0 inkarcana.xtapp \
              --target "$(git rev-parse HEAD)" \
              --title "InkArcana v1.5.0" \
              --notes-file release-notes.md
          fi
