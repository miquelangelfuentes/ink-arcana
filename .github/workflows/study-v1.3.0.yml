name: Update Study mode and publish v1.3.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/study-v1.3.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Improve Study mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('index.lua')
          s = p.read_text(encoding='utf-8')
          s = s.replace('-- Visual polish v1.2: refined spacing and e-paper-friendly controls.', '-- Study mode v1.3: card-first learning with upright and reversed meanings.')

          old_study = '''local function draw_study(gg)\n    title_bar(gg, "STUDY")\n    if #cards == 0 then return end\n    local c = cards[state.study_index]\n    centered(gg, 72, string.format("%d / %d", state.study_index, #cards), "small")\n    draw_card_art(gg, state.study_index, false, CARD_X, 96, CARD_W, CARD_H)\n    if state.study_revealed then\n        centered(gg, 530, c.name, "large")\n        centered(gg, 575, c.up_kw, "medium")\n        paragraph(gg, 615, c.up_read, "small", 390, 700)\n    else\n        centered(gg, 535, "MYSTERY CARD", "large")\n        centered(gg, 585, "Tap the card to reveal it", "medium")\n    end\n    button(gg, 24, 718, 118, 48, "PREV", "small")\n    button(gg, 168, 718, 144, 48, "RANDOM", "small")\n    button(gg, 338, 718, 118, 48, "NEXT", "small")\nend\n'''
          new_study = '''local function draw_study(gg)\n    title_bar(gg, "STUDY")\n    if #cards == 0 then return end\n    local c = cards[state.study_index]\n    centered(gg, 72, string.format("%d / %d", state.study_index, #cards), "small")\n\n    if not state.study_revealed then\n        draw_card_art(gg, state.study_index, false, CARD_X, 96, CARD_W, CARD_H)\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 530, c.name, card_font)\n        centered(gg, 575, c.up_kw, "medium")\n        gg:line(145, 620, 335, 620, { width = 1 })\n        centered(gg, 650, "Tap for meaning", "small")\n    else\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 104, c.name, card_font)\n\n        centered(gg, 150, "UPRIGHT", "small")\n        centered(gg, 178, c.up_kw, "medium")\n        gg:line(100, 214, 380, 214, { width = 1 })\n        paragraph(gg, 235, c.up_read, "small", 390, 365)\n\n        gg:line(100, 390, 380, 390, { width = 1 })\n        centered(gg, 410, "REVERSED", "small")\n        centered(gg, 438, c.rev_kw, "medium")\n        gg:line(100, 475, 380, 475, { width = 1 })\n        paragraph(gg, 495, c.rev_read, "small", 390, 670)\n        centered(gg, 684, "Tap to return to card", "small")\n    end\n\n    button(gg, 24, 718, 118, 48, "PREV", "small")\n    button(gg, 168, 718, 144, 48, "RANDOM", "small")\n    button(gg, 338, 718, 118, 48, "NEXT", "small")\nend\n'''
          if old_study not in s:
              raise SystemExit('Expected draw_study block not found')
          s = s.replace(old_study, new_study, 1)

          old_menu = '            elseif id == "study" then\n                state.mode = "study"; state.menu_open = false\n'
          new_menu = '            elseif id == "study" then\n                state.mode = "study"; state.study_revealed = false; state.menu_open = false\n'
          if old_menu not in s:
              raise SystemExit('Expected study menu block not found')
          s = s.replace(old_menu, new_menu, 1)

          old_tap = '''    if state.mode == "study" then\n        if y >= 718 and y <= 766 and x >= 24 and x <= 142 then\n            state.study_index = ((state.study_index - 2 + #cards) % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 338 and x <= 456 then\n            state.study_index = (state.study_index % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 168 and x <= 312 then\n            state.study_index = random_int(#cards)\n            state.study_revealed = false\n        elseif x >= CARD_X and x <= CARD_X + CARD_W and y >= 96 and y <= 96 + CARD_H then\n            state.study_revealed = not state.study_revealed\n        end\n        refresh()\n    end\n'''
          new_tap = '''    if state.mode == "study" then\n        if y >= 718 and y <= 766 and x >= 24 and x <= 142 then\n            state.study_index = ((state.study_index - 2 + #cards) % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 338 and x <= 456 then\n            state.study_index = (state.study_index % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 168 and x <= 312 then\n            state.study_index = random_int(#cards)\n            state.study_revealed = false\n        elseif state.study_revealed then\n            state.study_revealed = false\n        elseif x >= CARD_X and x <= CARD_X + CARD_W and y >= 96 and y <= 96 + CARD_H then\n            state.study_revealed = true\n        end\n        refresh()\n    end\n'''
          if old_tap not in s:
              raise SystemExit('Expected Study tap block not found')
          s = s.replace(old_tap, new_tap, 1)
          p.write_text(s, encoding='utf-8')

          manifest = Path('manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['version'] = '1.3.0'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          verify = Path('verify_container.py')
          v = verify.read_text(encoding='utf-8').replace('manifest["version"] == "1.2.2"', 'manifest["version"] == "1.3.0"')
          if v == verify.read_text(encoding='utf-8'):
              raise SystemExit('Expected v1.2.2 verifier version not found')
          verify.write_text(v, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          old_readme = 'Study mode shows one card at a time. You can hide its identity before revealing it, move through the deck with the screen controls or use the physical side buttons. A random-card control is also available.'
          new_readme = 'Study mode shows each card with its name and upright theme from the start. Tap the card to open a learning view with the upright interpretation and the reversed meaning. Use the on-screen controls or physical side buttons to move through the deck; a random-card control is also available.'
          if old_readme not in r:
              raise SystemExit('Expected Study README text not found')
          readme.write_text(r.replace(old_readme, new_readme, 1), encoding='utf-8')

          tests = Path('test_suite.py')
          t = tests.read_text(encoding='utf-8')
          marker = 'assert \'title:find("CARD REFLECTION", 1, true)\' in SOURCE, "spread headers must use the overlap-safe two-line layout"\n'
          addition = marker + 'assert \'"MYSTERY CARD"\' not in SOURCE, "Study mode must identify cards immediately"\nassert \'"Tap for meaning"\' in SOURCE, "Study mode must offer the learning view"\nassert \'centered(gg, 150, "UPRIGHT", "small")\' in SOURCE and \'centered(gg, 410, "REVERSED", "small")\' in SOURCE, "Study learning view must cover both orientations"\n'
          if 'Study mode must identify cards immediately' not in t:
              if marker not in t:
                  raise SystemExit('Expected test marker not found')
              t = t.replace(marker, addition, 1)

          runtime_marker = '''local before = S.spread_pos\non_input(ctx, { type = "key", key = "right", phase = "down", time_ms = 2000 })\nlocal after_one = S.spread_pos\non_input(ctx, { type = "key", key = "right", phase = "down", time_ms = 2100 })\nassert(after_one ~= before)\nassert(S.spread_pos == after_one, "duplicate key event was not debounced")\n\n'''
          runtime_add = runtime_marker + '''-- Study mode identifies the card immediately; tapping opens and closes the learning view.\nS.mode = "study"\nS.study_revealed = false\nlocal study_index = S.study_index\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2400 })\nassert(S.study_revealed == true, "Study card tap did not open the learning view")\nassert(S.study_index == study_index, "Study card tap changed the selected card")\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2600 })\nassert(S.study_revealed == false, "Study learning view did not return to the card")\n\n'''
          if 'Study card tap did not open the learning view' not in t:
              if runtime_marker not in t:
                  raise SystemExit('Expected runtime marker not found')
              t = t.replace(runtime_marker, runtime_add, 1)
          tests.write_text(t, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python test_suite.py

      - name: Rebuild and verify package
        run: python verify_container.py

      - name: Commit Study mode v1.3.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua manifest.json verify_container.py test_suite.py README.md inkarcana.xtapp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve Study mode for v1.3.0 [skip ci]"
            git push
          fi

      - name: Publish v1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 inkarcana.xtapp --clobber
          else
            gh release create v1.3.0 inkarcana.xtapp \
              --target "$(git rev-parse HEAD)" \
              --title "InkArcana v1.3.0" \
              --notes "Study mode is now designed for learning rather than guessing. Cards are identified immediately with their upright theme. Tapping a card opens a dedicated learning view with the upright interpretation and reversed meaning, while PREV, RANDOM and NEXT remain available for deck navigation. The Licorice API 2.9 regression suite and package verification pass on this build."
          fi
