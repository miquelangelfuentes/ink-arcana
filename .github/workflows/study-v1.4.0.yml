name: Improve Study orientation and publish v1.4.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/study-v1.4.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Improve Study orientation and text layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('index.lua')
          s = p.read_text(encoding='utf-8')
          s = s.replace('-- Study mode v1.3: card-first learning with upright and reversed meanings.', '-- Study mode v1.4: complete meanings with an upright/reversed orientation toggle.')

          if 'study_reversed = false,' not in s:
              s = s.replace('    study_revealed = false,\n    menu_open = false,', '    study_revealed = false,\n    study_reversed = false,\n    menu_open = false,', 1)

          if 'study_reversed = state.study_reversed,' not in s:
              s = s.replace('        study_index = state.study_index,\n', '        study_index = state.study_index,\n        study_reversed = state.study_reversed,\n', 1)

          old_study = '''local function draw_study(gg)\n    title_bar(gg, "STUDY")\n    if #cards == 0 then return end\n    local c = cards[state.study_index]\n    centered(gg, 72, string.format("%d / %d", state.study_index, #cards), "small")\n\n    if not state.study_revealed then\n        draw_card_art(gg, state.study_index, false, CARD_X, 96, CARD_W, CARD_H)\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 530, c.name, card_font)\n        centered(gg, 575, c.up_kw, "medium")\n        gg:line(145, 620, 335, 620, { width = 1 })\n        centered(gg, 650, "Tap for meaning", "small")\n    else\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 104, c.name, card_font)\n\n        centered(gg, 150, "UPRIGHT", "small")\n        centered(gg, 178, c.up_kw, "medium")\n        gg:line(100, 214, 380, 214, { width = 1 })\n        paragraph(gg, 235, c.up_read, "small", 390, 365)\n\n        gg:line(100, 390, 380, 390, { width = 1 })\n        centered(gg, 410, "REVERSED", "small")\n        centered(gg, 438, c.rev_kw, "medium")\n        gg:line(100, 475, 380, 475, { width = 1 })\n        paragraph(gg, 495, c.rev_read, "small", 390, 670)\n        centered(gg, 684, "Tap to return to card", "small")\n    end\n\n    button(gg, 24, 718, 118, 48, "PREV", "small")\n    button(gg, 168, 718, 144, 48, "RANDOM", "small")\n    button(gg, 338, 718, 118, 48, "NEXT", "small")\nend\n'''
          new_study = '''local function draw_study(gg)\n    title_bar(gg, "STUDY")\n    if #cards == 0 then return end\n    local c = cards[state.study_index]\n    centered(gg, 72, string.format("%d / %d", state.study_index, #cards), "small")\n\n    local orientation = state.study_reversed and "REVERSED" or "UPRIGHT"\n    local keywords = state.study_reversed and c.rev_kw or c.up_kw\n    local meaning = state.study_reversed and c.rev_read or c.up_read\n    local toggle_label = state.study_reversed and "SHOW UPRIGHT" or "SHOW REVERSED"\n\n    if not state.study_revealed then\n        draw_card_art(gg, state.study_index, state.study_reversed, CARD_X, 96, CARD_W, CARD_H)\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 530, c.name, card_font)\n        centered(gg, 575, keywords, "medium")\n        centered(gg, 610, orientation, "small")\n        button(gg, 150, 638, 180, 44, toggle_label, "small")\n        centered(gg, 690, "Tap the card for meaning", "small")\n    else\n        local card_font = text_width(font("large"), c.name) > 420 and "medium" or "large"\n        centered(gg, 102, c.name, card_font)\n        centered(gg, 148, orientation, "small")\n        centered(gg, 178, keywords, "medium")\n        gg:line(90, 216, 390, 216, { width = 1 })\n        paragraph(gg, 242, meaning, "small", 410, 610)\n        button(gg, 150, 638, 180, 44, toggle_label, "small")\n        centered(gg, 690, "Tap elsewhere to return to card", "small")\n    end\n\n    button(gg, 24, 718, 118, 48, "PREV", "small")\n    button(gg, 168, 718, 144, 48, "RANDOM", "small")\n    button(gg, 338, 718, 118, 48, "NEXT", "small")\nend\n'''
          if old_study not in s:
              raise SystemExit('Expected v1.3 draw_study block not found')
          s = s.replace(old_study, new_study, 1)

          old_tap = '''    if state.mode == "study" then\n        if y >= 718 and y <= 766 and x >= 24 and x <= 142 then\n            state.study_index = ((state.study_index - 2 + #cards) % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 338 and x <= 456 then\n            state.study_index = (state.study_index % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 168 and x <= 312 then\n            state.study_index = random_int(#cards)\n            state.study_revealed = false\n        elseif state.study_revealed then\n            state.study_revealed = false\n        elseif x >= CARD_X and x <= CARD_X + CARD_W and y >= 96 and y <= 96 + CARD_H then\n            state.study_revealed = true\n        end\n        refresh()\n    end\n'''
          new_tap = '''    if state.mode == "study" then\n        if y >= 718 and y <= 766 and x >= 24 and x <= 142 then\n            state.study_index = ((state.study_index - 2 + #cards) % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 338 and x <= 456 then\n            state.study_index = (state.study_index % #cards) + 1\n            state.study_revealed = false\n        elseif y >= 718 and y <= 766 and x >= 168 and x <= 312 then\n            state.study_index = random_int(#cards)\n            state.study_revealed = false\n        elseif x >= 150 and x <= 330 and y >= 638 and y <= 682 then\n            state.study_reversed = not state.study_reversed\n            save_state()\n        elseif state.study_revealed then\n            state.study_revealed = false\n        elseif y >= 90 and y <= 620 then\n            state.study_revealed = true\n        end\n        refresh()\n    end\n'''
          if old_tap not in s:
              raise SystemExit('Expected v1.3 Study tap block not found')
          s = s.replace(old_tap, new_tap, 1)

          load_marker = '''            if saved.study_index and #cards > 0 then\n                state.study_index = math.max(1, math.min(#cards, tonumber(saved.study_index) or 1))\n            end\n'''
          load_replacement = load_marker + '''            if saved.study_reversed ~= nil then\n                state.study_reversed = saved.study_reversed == true\n            end\n'''
          if 'saved.study_reversed' not in s:
              if load_marker not in s:
                  raise SystemExit('Expected Study state restore block not found')
              s = s.replace(load_marker, load_replacement, 1)

          p.write_text(s, encoding='utf-8')

          manifest = Path('manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['version'] = '1.4.0'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          verify = Path('verify_container.py')
          v0 = verify.read_text(encoding='utf-8')
          v = v0.replace('manifest["version"] == "1.3.0"', 'manifest["version"] == "1.4.0"')
          if v == v0:
              raise SystemExit('Expected v1.3.0 verifier version not found')
          verify.write_text(v, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          old_readme = 'Study mode shows each card with its name and upright theme from the start. Tap the card to open a learning view with the upright interpretation and the reversed meaning. Use the on-screen controls or physical side buttons to move through the deck; a random-card control is also available.'
          new_readme = 'Study mode shows each card with its name and the currently selected orientation. Use the upright/reversed toggle to rotate the card and switch its keywords. Tap the card to open the full interpretation for that orientation; this gives the meaning enough space to display without being cut short. The deck navigation controls remain available below.'
          if old_readme not in r:
              raise SystemExit('Expected v1.3 Study README text not found')
          readme.write_text(r.replace(old_readme, new_readme, 1), encoding='utf-8')

          tests = Path('test_suite.py')
          t = tests.read_text(encoding='utf-8')
          marker = 'assert \'centered(gg, 150, "UPRIGHT", "small")\' in SOURCE and \'centered(gg, 410, "REVERSED", "small")\' in SOURCE, "Study learning view must cover both orientations"\n'
          if marker in t:
              t = t.replace(marker, 'assert \'study_reversed = false\' in SOURCE, "Study mode needs an orientation state"\nassert \'"SHOW REVERSED"\' in SOURCE and \'"SHOW UPRIGHT"\' in SOURCE, "Study mode needs an upright/reversed toggle"\nassert \'paragraph(gg, 242, meaning, "small", 410, 610)\' in SOURCE, "Study meaning needs the full reading area"\n', 1)
          else:
              raise SystemExit('Expected v1.3 Study static test not found')

          old_runtime = '''-- Study mode identifies the card immediately; tapping opens and closes the learning view.\nS.mode = "study"\nS.study_revealed = false\nlocal study_index = S.study_index\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2400 })\nassert(S.study_revealed == true, "Study card tap did not open the learning view")\nassert(S.study_index == study_index, "Study card tap changed the selected card")\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2600 })\nassert(S.study_revealed == false, "Study learning view did not return to the card")\n\n'''
          new_runtime = '''-- Study mode identifies the card, exposes both orientations, and keeps one full meaning on screen.\nS.mode = "study"\nS.study_revealed = false\nS.study_reversed = false\nlocal study_index = S.study_index\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2400 })\nassert(S.study_revealed == true, "Study card tap did not open the learning view")\nassert(S.study_index == study_index, "Study card tap changed the selected card")\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 655, time_ms = 2600 })\nassert(S.study_reversed == true, "Study orientation toggle did not select reversed")\nassert(S.study_revealed == true, "Changing Study orientation closed the learning view")\non_input(ctx, { type = "pointer", phase = "up", gesture = "tap", x = 240, y = 300, time_ms = 2800 })\nassert(S.study_revealed == false, "Study learning view did not return to the card")\nassert(S.study_reversed == true, "Study orientation was not preserved when returning to the card")\n\n'''
          if old_runtime not in t:
              raise SystemExit('Expected v1.3 Study runtime test not found')
          t = t.replace(old_runtime, new_runtime, 1)
          tests.write_text(t, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python test_suite.py

      - name: Rebuild and verify package
        run: python verify_container.py

      - name: Commit Study mode v1.4.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua manifest.json verify_container.py test_suite.py README.md inkarcana.xtapp
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve Study orientation and text layout for v1.4.0 [skip ci]"
            git push
          fi

      - name: Publish v1.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 inkarcana.xtapp --clobber
          else
            gh release create v1.4.0 inkarcana.xtapp \
              --target "$(git rev-parse HEAD)" \
              --title "InkArcana v1.4.0" \
              --notes "Improves Study mode on the XTEINK X4 Pro. Study now has an explicit upright/reversed toggle; reversed study rotates the card artwork where the device supports image transforms and shows the matching keywords and interpretation. The learning view displays one orientation at a time, giving the full reflection substantially more room so text is not truncated. Regression tests and Licorice package verification pass on this build."
          fi
