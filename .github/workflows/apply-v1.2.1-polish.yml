name: Apply InkArcana v1.2.1 polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v1.2.1-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header and icon polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json

          p = Path('index.lua')
          s = p.read_text(encoding='utf-8')
          old = '''local function title_bar(gg, title)\n    button(gg, HEADER_MENU_X, HEADER_MENU_Y, HEADER_MENU_W, HEADER_MENU_H, "MENU", "small")\n    local title_font = "medium"\n    if text_width(font(title_font), title) > W - 130 then title_font = "small" end\n    centered(gg, 22, title, title_font)\n    gg:line(14, HEADER_RULE_Y, W - 14, HEADER_RULE_Y, { width = 1 })\nend\n'''
          new = '''local function title_bar(gg, title)\n    button(gg, HEADER_MENU_X, HEADER_MENU_Y, HEADER_MENU_W, HEADER_MENU_H, "MENU", "small")\n    local left = HEADER_MENU_X + HEADER_MENU_W + 12\n    local right = W - 14\n    local title_font = "medium"\n    local tw = text_width(font(title_font), title)\n    if tw > right - left then\n        title_font = "small"\n        tw = text_width(font(title_font), title)\n    end\n    local tx = left + math.max(0, math.floor(((right - left) - tw) / 2))\n    gg:text(tx, 22, title, { font = font(title_font) })\n    gg:line(14, HEADER_RULE_Y, W - 14, HEADER_RULE_Y, { width = 1 })\nend\n'''
          if old not in s:
              raise SystemExit('Expected title_bar block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          icon_b64 = ''
          Path('icon.png').write_bytes(base64.b64decode(icon_b64))

          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          manifest['version'] = '1.2.1'
          Path('manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          vp = Path('verify_container.py')
          v = vp.read_text(encoding='utf-8')
          v = v.replace('assert manifest["version"] == "1.1"', 'assert manifest["version"] == "1.2.1"')
          vp.write_text(v, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua icon.png manifest.json verify_container.py
          git commit -m "Refine header layout and app icon for v1.2.1"
          git push
