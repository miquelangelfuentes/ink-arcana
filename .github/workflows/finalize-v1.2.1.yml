name: Finalize InkArcana v1.2.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v1.2.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final icon and verifier version
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          icon_b64 = ''
          Path('icon.png').write_bytes(base64.b64decode(icon_b64))
          p = Path('verify_container.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assert manifest["version"] == "1.2"', 'assert manifest["version"] == "1.2.1"')
          s = s.replace('assert manifest["version"] == "1.1"', 'assert manifest["version"] == "1.2.1"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python test_suite.py
      - run: python verify_container.py
      - name: Commit final package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png verify_container.py inkarcana.xtapp
          git commit -m "Finalize InkArcana v1.2.1 [skip ci]"
          git push
