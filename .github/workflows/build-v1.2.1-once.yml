name: Build InkArcana v1.2.1 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-v1.2.1-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python test_suite.py
      - run: python verify_container.py
      - name: Commit rebuilt package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inkarcana.xtapp
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild InkArcana v1.2.1 package [skip ci]"
            git push
          fi
