name: Export InkArcana preview assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-preview-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract real card assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, shutil
          out = Path('preview-assets')
          out.mkdir()
          lines = Path('data/art_l1.txt').read_text(encoding='utf-8').splitlines()
          # m09 The Hermit = card 10; m18 The Moon = card 19
          for idx, name in [(10, 'hermit.png'), (19, 'moon.png')]:
              (out / name).write_bytes(base64.b64decode(lines[idx-1].strip()))
          shutil.copyfile('icon.png', out / 'icon-current.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: inkarcana-preview-assets
          path: preview-assets/
