name: Build and verify InkArcana

on:
  push:
    branches: [main]
    paths:
      - index.lua
      - manifest.json
      - data/**
      - icon.png
      - xtpack.py
      - verify_container.py
      - test_suite.py
      - requirements.txt
      - tools/**
      - .github/workflows/build-and-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply visual polish v1.2
        run: python tools/polish_v12.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API 2.9 regression tests
        run: python test_suite.py

      - name: Rebuild and verify package
        run: python verify_container.py

      - name: Commit polished source and package
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lua manifest.json verify_container.py inkarcana.xtapp
          if ! git diff --cached --quiet; then
            git commit -m "Polish InkArcana interface for v1.2 [skip ci]"
            git push
          fi
